<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#313244"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba6f7"/>
      <stop offset="1" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- fundo -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="106.5" fill="none" stroke="#585b70" stroke-opacity="0.55" stroke-width="3"/>

  <!-- conector RJ45 -->
  <g filter="url(#shadow)">
    <path d="M136 120 h240 a28 28 0 0 1 28 28 v130 a28 28 0 0 1 -28 28 h-56 v34 a14 14 0 0 1 -14 14 h-100 a14 14 0 0 1 -14 -14 v-34 h-56 a28 28 0 0 1 -28 -28 v-130 a28 28 0 0 1 28 -28 z"
          fill="url(#port)"/>
  </g>
  <!-- abertura -->
  <path d="M160 150 h192 a12 12 0 0 1 12 12 v100 a12 12 0 0 1 -12 12 h-52 v26 a8 8 0 0 1 -8 8 h-80 a8 8 0 0 1 -8 -8 v-26 h-52 a12 12 0 0 1 -12 -12 v-100 a12 12 0 0 1 12 -12 z"
        fill="url(#hole)"/>
  <!-- contatos -->
  <g fill="#f9e2af">
    <rect x="179" y="150" width="14" height="50" rx="4"/>
    <rect x="207" y="150" width="14" height="50" rx="4"/>
    <rect x="235" y="150" width="14" height="50" rx="4"/>
    <rect x="263" y="150" width="14" height="50" rx="4"/>
    <rect x="291" y="150" width="14" height="50" rx="4"/>
    <rect x="319" y="150" width="14" height="50" rx="4"/>
  </g>

  <!-- linha de atividade -->
  <polyline points="72,410 168,410 196,410 222,364 252,446 280,384 302,410 440,410"
            fill="none" stroke="#a6e3a1" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- indicador "ao vivo" -->
  <circle cx="410" cy="102" r="34" fill="#a6e3a1" opacity="0.18"/>
  <circle cx="410" cy="102" r="20" fill="#a6e3a1" filter="url(#glow)"/>
</svg>
