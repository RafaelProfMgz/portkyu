name: release

# Ao criar uma tag vX.Y.Z, compila no Ubuntu 22.04 (glibc 2.35, roda na maioria das distros)
# e publica o AppImage e o tarball na página de releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Gerar AppImage e tarball
        run: ./scripts/build-appimage.sh

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PortKyu-*-x86_64.AppImage
            dist/portkyu-x86_64-linux.tar.gz
            dist/SHA256SUMS
