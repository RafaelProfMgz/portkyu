name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatação
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release --locked -- -D warnings
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test
        run: |
          ./target/release/portkyu --version
          ./target/release/portkyu -l
          ./target/release/portkyu --demo -l
